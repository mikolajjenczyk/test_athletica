  document.querySelectorAll("[aria-controls=zn-panel]").forEach(b => b.setAttribute("aria-expanded","true"));
}
function closeZn(back) { const pn = $("#zn-panel"); if (pn.hidden) return; pn.hidden = true; pn.dataset.auto = ""; document.querySelectorAll("[aria-controls=zn-panel]").forEach(b => b.setAttribute("aria-expanded","false")); if (back && ZN_FROM && ZN_FROM.isConnected) ZN_FROM.focus(); ZN_FROM = null; }
const toggleZn = from => { const d = document.getElementById("zn-dialog"); if (d) d.close(); else openZn(from); };
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#zn-panel").hidden && !document.querySelector("dialog[open]")) closeZn(true); });
// rev-049 (D341): a tap outside the panel closes it
document.addEventListener("click", e => { const pn = $("#zn-panel"); if (pn.hidden || pn.contains(e.target) || (e.target.closest && e.target.closest("[aria-controls=zn-panel]"))) return; closeZn(false); }, true);
$("#zn-hdr").addEventListener("click", e => toggleZn(e.currentTarget));
$("#eye-hdr").addEventListener("click", () => setHideNames(!S.hideNames));
function znaki(o) {
  o = o || {}; const pl = o.players!==false && isCoach();
  const col = (title, items, mk) => h("div",{class:"zn-col"}, h("p",{text:title}), h("ul",null, items.map(([c, t]) => h("li",null, mk(c), h("span",{text:t})))));
  const body = h("div",{class:"zn" + (pl ? "" : " one")}, col("Testy", ZN_TEST, c => h("i",{class:`sq ${c}`,"aria-hidden":"true"})), pl ? col("Zawodnicy", ZN_PL, c => h("i",{class:`pmk pm-${c}`,"aria-hidden":"true"})) : null);
  const tipEl = infoTip("Pokaż, kiedy pokazuje się każde oznaczenie", ZN_RULE_T + (pl ? ZN_RULE_P : ""));
  if (o.inline) return h("div",{class:"zn-inline",id:o.id || null}, h("p",{class:"om-h2"}, "Oznaczenia ", tipEl), body);
  return widget("Oznaczenia", null, [body, note("D283 (klient 21.10): jedna widoczna legenda, nie tylko w ⓘ. Kwadraty testów stoją przy „Zrealizowane: N z 6” (Pulpit, drużyna, dyrektor); znaki zawodników przy nazwiskach w „Ostatnim teście” i w tabeli drużyny, tylko u trenera. „zmęczenie” bierze się tylko z danych, z " + N.readyGen + " albo z " + N.loadGen + ", nigdy z oceny zdrowia. Kiedy pokazuje się znak: w ⓘ. Na telefonie legenda stoi pod kartami testów.")], null, tipEl, {id:"oznaczenia"});
}
// the counter with its squares in one line, as on the Pulpit: the coach's definition for the coach, the director's for the director (one definition is open, D251)
function freshLine(t) {
  if (isDir()) { const R0 = roundOf(t); return h("p",{class:"fresh-line",id:`fresh-team-${t}`}, h("span",{class:"fresh-txt",text:roundLine(t)}), h("span",{class:"fresh-bars","aria-hidden":"true"}, R0.rows.map(r => h("i",{class:sqDir(r),title:`${T(r.k).name}: ${testState(t, r.k)}`})))); }
  const rows = testStates(t), since = roundOf(t).start ? dm(roundOf(t).start) : null;
  return h("p",{class:"fresh-line",id:`fresh-team-${t}`}, h("span",{class:"fresh-txt",text:roundLine(t)}), h("span",{class:"fresh-bars","aria-hidden":"true"}, rows.map(r => h("i",{class:sqOf(r.st),title:`${T(r.k).name}: ${freshText(r, false)}`}))));
}

/* ================= test state ================= */
function syncStan() { $("#st-role").value = S.role; $("#st-multi").checked = S.multi; $("#st-data").value = S.data; $("#st-ai").checked = S.aiDown; $("#st-sheet").checked = !!S.sheetDown; $("#st-proposals").checked = S.proposals; $("#st-goals").value = S.goalVar; $("#st-cmj").checked = S.cmjOn; $("#st-thr").value = S.thrSrc; $("#st-offline").checked = !!S.offline; }
// rev-053 (D415, P34): a change in the test bar keeps the screen (when the new role may see it) and says what changed in a toast
$("#st-role").addEventListener("change", e => { S.role = e.target.value; S.trail = []; if (!CUR || !ACCESS[S.role].includes(CUR.name) || isAdmin()) location.hash = HOME[S.role]; render(); say(`Rola: ${ROLE_NAME[S.role]}.`); });
$("#st-multi").addEventListener("change", e => { S.multi = e.target.checked; S.plTeam = ""; render(); say(S.multi ? "Pokazano klub z kilkoma drużynami (po MVP)." : "Klub z jedną drużyną (MVP)."); });
// D83 (revision-028): proposals outside the MVP ("Terminy testów") show only with this switch; off by default
$("#st-proposals").addEventListener("change", e => { S.proposals = e.target.checked; render(); say(S.proposals ? "Pokazano propozycje poza MVP." : "Ukryto propozycje poza MVP."); });
$("#st-data").addEventListener("change", e => { const hn = S.hideNames; initial(e.target.value, {znSeen:S.znSeen, role:S.role, multi:S.multi, aiDown:S.aiDown, proposals:S.proposals, club:S.club, goalVar:S.goalVar, cmjOn:S.cmjOn, thrSrc:S.thrSrc}); S.hideNames = hn; syncStan(); render(); if (S.nf || !$("#main h1")) location.hash = HOME[S.role]; say(`Dane: ${e.target.selectedOptions[0].textContent}.`); });
// D349, rev-049 fix round (Codex 3, 4): the switch is the phone's signal in both views; when it comes back the waiting results are sent (and acknowledged)
$("#st-offline").addEventListener("change", e => { S.offline = e.target.checked; outboxWrite();
  if (S.offline) { render(); say("Brak zasięgu: wyniki zostają w telefonie (stan testowy)."); } else if (unsentN()) sendOutbox(true); else { render(); say("Zasięg wrócił."); } });
$("#st-sheet").addEventListener("change", e => { S.sheetDown = e.target.checked; S.refreshErr = false; render(); });
$("#st-ai").addEventListener("change", e => { S.aiDown = e.target.checked; say(S.aiDown ? "AI nie odpowiada (stan testowy)." : "AI działa."); });
// rev-044 (D277, D279): the goal variant and the frequent CMJ are test switches; the designer picks a goal variant, the client decides the scope
$("#st-goals").addEventListener("change", e => { S.goalVar = e.target.value; render(); say(`Wariant celów: ${e.target.selectedOptions[0].textContent}.`); });
$("#st-cmj").addEventListener("change", e => { S.cmjOn = e.target.checked; render(); say(S.cmjOn ? "Pokazano " + N.readyLow + "." : "Ukryto " + N.readyLow + "."); });
// rev-045 (D259, D273c; Q64 open): no test has a source for its „Wyraźna zmiana od” yet; the switch shows the state with a sample source (default, as in rev-044) and without one
$("#st-thr").addEventListener("change", e => { S.thrSrc = e.target.value; render(); say(S.thrSrc==="none" ? "„Wyraźna zmiana od” bez źródła: różnica bez oceny." : "„Wyraźna zmiana od” ze źródłem (przykład)."); });
$("#st-notes").addEventListener("change", e => document.body.classList.toggle("notes", e.target.checked));
$("#st-reset").addEventListener("click", () => { try { localStorage.removeItem(OUTBOX); } catch (e) {} initial("sample"); syncStan(); document.querySelectorAll("dialog").forEach(d => d.close()); if (location.hash==="#dashboard") render(); else location.hash = "#dashboard"; say("Symulacja zresetowana: przykładowe dane, rola Trener, 8.10.2026."); });

initial("sample"); const fromPhone = outboxLoad(); syncStan(); iconize(document.body); render();
if (fromPhone) say(`Wyniki z telefonu są z powrotem: niewysłane: ${fromPhone}.`);
</script>
